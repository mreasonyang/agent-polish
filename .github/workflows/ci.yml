name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      legacy:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux }
          - { os: macos-latest, name: macOS }
          - { os: windows-latest, name: Windows ACP, pattern: '^acp' }
          - { os: windows-latest, name: Windows installer, pattern: '^install' }
          - { os: windows-latest, name: Windows history, pattern: '^history' }
          - { os: windows-latest, name: Windows core, pattern: '^(?!acp|install|history)' }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --global @openai/codex@0.170.0
      - run: codex --version
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_PATTERN: ${{ matrix.pattern }}
        run: |
          $files = @(Get-ChildItem tests -Filter '*.test.mjs' | Where-Object { $_.Name -match $env:TEST_PATTERN })
          if (!$files.Count) { throw 'No tests matched' }
          node --test $files.FullName
  packages:
    if: '!inputs.legacy'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Package isolation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --global @openai/codex@0.170.0
      - name: Install and verify the native Antigravity CLI
        run: node .github/scripts/install-native-agy.mjs
      - name: Test both packages against the native hosts
        run: node --test tests/workspace_packages.test.mjs
      - uses: actions/download-artifact@v4
        if: inputs.ref != ''
        with:
          name: npm-release
          path: ${{ runner.temp }}/qualified-npm-release
      - name: Install each workspace archive independently
        shell: pwsh
        run: |
          $npm = if ($IsWindows) { 'npm.cmd' } else { 'npm' }
          $work = Join-Path $env:RUNNER_TEMP 'Agent Polish packages'
          New-Item -ItemType Directory -Path $work | Out-Null
          $names = @('codex-polish', 'agy-polish')
          foreach ($name in $names) {
            $other = $names | Where-Object { $_ -ne $name }
            $file = & $npm pack --workspace "@kyun.si/$name" --silent --pack-destination $work
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $archives = @(Join-Path $work $file)
            $qualified = Join-Path $env:RUNNER_TEMP "qualified-npm-release/$file"
            if (Test-Path -LiteralPath $qualified) { $archives += $qualified }
            foreach ($archive in $archives) {
              $project = Join-Path $work ([guid]::NewGuid().ToString())
              New-Item -ItemType Directory -Path $project | Out-Null
              Push-Location $project
              & $npm install --offline --ignore-scripts --no-save --no-package-lock $archive
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $package = Join-Path $project "node_modules/@kyun.si/$name"
              $manifest = Get-Content -Raw (Join-Path $package 'package.json') | ConvertFrom-Json
              if ($manifest.name -ne "@kyun.si/$name" -or -not $manifest.bin.$name) { throw "Unexpected npm manifest in $archive" }
              if ((Test-Path -LiteralPath (Join-Path $package "plugins/$other")) -or
                  (Test-Path -LiteralPath (Join-Path $project "node_modules/@kyun.si/$other"))) {
                throw "$name installed files for $other"
              }
              $env:LC_ALL = 'en_US.UTF-8'
              $helpText = & node (Join-Path $package $manifest.bin.$name) --help | Out-String
              if ($LASTEXITCODE -ne 0 -or $helpText -notmatch "Usage: $name\b") { throw "Cannot run $name from $archive" }
              Pop-Location
            }
          }
