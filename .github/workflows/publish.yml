name: Publish beta to npm
on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag to publish or verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-beta
  queue: max

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  qualify:
    if: (github.event_name == 'push' && !github.event.deleted) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check the release tag
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          [[ "$RELEASE_TAG" =~ ^v${number}\.${number}\.${number}-beta\.${number}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - id: source
        name: Record the tagged commit
        run: |
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.20.0 @openai/codex@0.170.0
      - name: Verify package and plugin versions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import pkg from './package.json' with { type: 'json' };
          import plugin from './plugins/codex-polish/.codex-plugin/plugin.json' with { type: 'json' };
          assert.equal(pkg.name, '@kyun.si/codex-polish');
          assert.equal('v' + pkg.version, process.env.RELEASE_TAG);
          assert.equal(plugin.version, pkg.version);
          assert.equal(pkg.publishConfig.tag, 'beta');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.registry, 'https://registry.npmjs.org/');
          NODE
      - run: npm test
      - name: Pack the tagged source
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-beta
          path: ${{ runner.temp }}/kyun.si-codex-polish-*.tgz
          if-no-files-found: error

  platform-tests:
    needs: qualify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.qualify.outputs.source_sha }}

  publish:
    runs-on: ubuntu-latest
    needs: [qualify, platform-tests]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.21.3
      - uses: actions/download-artifact@v4
        with:
          name: npm-beta
          path: ${{ runner.temp }}/npm-beta
      - name: Publish the verified archive via npm OIDC and attach it to the GitHub prerelease
        run: bash .github/scripts/publish-beta.sh
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
