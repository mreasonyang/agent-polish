name: Publish to npm
on:
  push:
    tags:
      - 'codex-v[0-9]*.[0-9]*.[0-9]*'
      - 'agy-v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing host or legacy Codex release tag (branch dispatch requires a published npm version)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Share the lock with the original Codex workflow and serialize GitHub releases.
  group: npm-beta
  queue: max

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  qualify:
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' &&
       (startsWith(github.ref, 'refs/heads/') || github.ref == format('refs/tags/{0}', inputs.tag)))
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      legacy: ${{ steps.tag.outputs.legacy }}
      filename: ${{ steps.tag.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: tag
        name: Identify the npm target
        shell: bash
        run: |
          source .github/scripts/release-tag.sh
          if "$legacy" && [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Recover legacy tags by dispatching publish.yml from main." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            encoded_package=${package/\//%2f}
            if ! curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
                "https://registry.npmjs.org/$encoded_package/$version?verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-qualify" |
                jq -e --arg pkg "$package" --arg v "$version" '
                  .name == $pkg and .version == $v and (.dist.integrity | type == "string" and length > 0)
                ' > /dev/null; then
              echo "Branch dispatch requires an existing npm release of $package@$version." >&2
              exit 1
            fi
          fi
          {
            echo "legacy=$legacy"
            echo "filename=$filename"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false
      - id: source
        name: Record the tagged commit
        working-directory: source
        run: |
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.21.3
      - name: Verify the tagged manifests and pack the selected package
        shell: bash
        run: |
          source .github/scripts/release-tag.sh
          node .github/scripts/verify-release.mjs source "$host" "$version" "$channel" "$legacy"
          cd source
          if "$legacy"; then
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          else
            npm pack --workspace "$package" --pack-destination "$RUNNER_TEMP"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/${{ steps.tag.outputs.filename }}
          if-no-files-found: error

  platform-tests:
    needs: qualify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.qualify.outputs.source_sha }}
      legacy: ${{ needs.qualify.outputs.legacy == 'true' }}

  publish:
    runs-on: ubuntu-latest
    needs: [qualify, platform-tests]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.21.3
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      - name: Publish the verified archive via npm OIDC and attach it to the GitHub release
        run: bash .github/scripts/publish.sh
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
